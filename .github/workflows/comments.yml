name: Reply to BUDGET comments

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List matching comments, post nothing"
        type: boolean
        default: false

# Both workflows commit state files, so they never run at the same time.
concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation
            content/links.json
            requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reply to comments
        run: python automation/comment_responder.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}

      - name: Save replied comments
        run: |
          git config user.name "cents-sheets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/replied.json
          git diff --cached --quiet && exit 0
          git commit -m "Record replied comments"
          git pull --rebase && git push
