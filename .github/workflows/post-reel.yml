name: Post today's reel

on:
  schedule:
    # GitHub often starts on-the-hour schedules hours late, so these use odd minutes.
    # 14:37 UTC is about 10:37 am in New York (daylight time) and 8:37 pm in Dhaka.
    # The 17:07 run only posts if the first one failed or a reel is still behind.
    - cron: "37 14 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Calendar day to post (blank = earliest unposted day up to today)"
        required: false
      dry_run:
        description: "Show what would be posted, post nothing"
        type: boolean
        default: true
      upload_test:
        description: "Upload to Instagram and wait for processing, but do not publish"
        type: boolean
        default: false

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post reel
        run: |
          args=""
          [ -n "${{ inputs.day }}" ] && args="--day ${{ inputs.day }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.upload_test }}" = "true" ] && args="$args --upload-test"
          python automation/post_reel.py $args
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
          REELS_START_DATE: ${{ secrets.REELS_START_DATE }}

      - name: Save posted log
        run: |
          git config user.name "cents-sheets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Record posted reel"
          git pull --rebase && git push
