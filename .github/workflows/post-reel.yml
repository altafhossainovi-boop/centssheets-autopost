name: Post today's reel

on:
  schedule:
    # 16:00 UTC: noon in New York during daylight time, 10 pm in Dhaka.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Calendar day to post (blank = today's day)"
        required: false
      dry_run:
        description: "Show what would be posted, post nothing"
        type: boolean
        default: true

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post reel
        run: |
          args=""
          [ -n "${{ inputs.day }}" ] && args="--day ${{ inputs.day }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python automation/post_reel.py $args
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
          REELS_START_DATE: ${{ secrets.REELS_START_DATE }}

      - name: Save posted log
        run: |
          git config user.name "cents-sheets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Record posted reel"
          git pull --rebase && git push
